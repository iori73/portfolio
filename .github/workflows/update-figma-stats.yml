name: Update Figma Plugin Stats

on:
  schedule:
    - cron: '0 4 * * *'  # 毎日 4時 (UTC) = 13時 JST
  workflow_dispatch:       # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install xvfb
        # Figma Community's bot protection blocks headless Chromium outright
        # (confirmed empirically — see scripts/scrape-figma-stats.mjs header
        # comment). The scraper runs Chromium in headed mode, so it needs a
        # virtual display on this display-less runner.
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Scrape Figma Community stats
        run: xvfb-run -a pnpm run scrape:figma-stats

      - name: Commit stats via PR and merge
        # main is protected ("Changes must be made through a pull request"), so
        # a direct push is rejected (this is why every run since 2026-09-21
        # failed). Push a branch, open a PR, and merge it immediately — the
        # ruleset requires 0 approvals and no status checks. The merge to main
        # triggers the Vercel deploy.
        run: |
          git diff --quiet components/work/figma-plugins/pluginStats.json && { echo "No stat changes."; exit 0; }
          BRANCH="chore/figma-stats-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add components/work/figma-plugins/pluginStats.json
          git commit -m "chore: update Figma plugin stats"
          git push --force origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore: update Figma plugin stats ($(date -u +%Y-%m-%d))" \
            --body "Automated daily sync from Figma Community (scripts/scrape-figma-stats.mjs)."
          gh pr merge "$BRANCH" --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open an issue if the scrape failed
        if: failure()
        run: |
          gh issue create \
            --title "Figma plugin stats scrape failed ($(date -u +%Y-%m-%d))" \
            --body "The scheduled Figma Community stats scrape (scripts/scrape-figma-stats.mjs) failed, so pluginStats.json was NOT updated (or its PR could not be created or merged). This usually means Figma changed their page markup, their bot-detection, or a tracked plugin/profile URL is wrong. Check the failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
