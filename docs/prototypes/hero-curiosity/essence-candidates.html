<meta charset="utf-8">
<title>Essence Candidates</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
/* Layout: a contact sheet of motion pictograms, one tile per candidate, grouped by interest. Ink on warm white, as EJP. */
:root {
  --bg: #F4F4F1;
  --tile: #F4F4F1;
  --ink: #111111;
  --soft: #6B6E6A;
  --line: #DCDCD6;
  --miru: #596327;
  --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  --jp: "Noto Sans JP", "Hiragino Sans", sans-serif;
}
body { background: var(--bg); color: var(--ink); font-family: var(--sans); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px 72px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px 32px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
h1 { font-weight: 500; font-size: 22px; letter-spacing: .01em; margin: 0 0 6px; }
.lede { font-size: 13px; line-height: 1.7; color: var(--soft); margin: 0; max-width: 64ch; }
.jp { font-family: var(--jp); }
.lede .jp, .cand .jp { color: var(--ink); }
.ctrl { display: flex; gap: 8px; flex-wrap: wrap; }
.ctrl button { font: inherit; font-size: 12px; letter-spacing: .04em; color: var(--ink); background: transparent; border: 1px solid var(--ink); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.ctrl button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.ctrl button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.group { display: grid; grid-template-columns: 180px 1fr; gap: 16px 28px; padding-block: 28px; border-bottom: 1px solid var(--line); }
.group h2 { margin: 4px 0 0; font-weight: 500; font-size: 15px; line-height: 1.5; }
.group h2 small { display: block; font-weight: 400; font-size: 12px; letter-spacing: .06em; color: var(--soft); text-transform: uppercase; margin-top: 2px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; }
figure { margin: 0; display: grid; gap: 10px; align-content: start; }
.stage { background: var(--tile); border: 1px solid var(--line); aspect-ratio: 1 / 1; max-width: 100%; display: block; width: 100%; }
.num { font-size: 11px; letter-spacing: .08em; color: var(--soft); }
.cand { font-size: 12.5px; line-height: 1.65; color: var(--soft); margin: 0; }
@media (max-width: 640px) { .group { grid-template-columns: 1fr; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Essence candidates</h1>
      <p class="lede"><span class="jp">関心ごとに「これをすればそれと分かる」動作の候補を、全部モーションピクトにした。EJP にならい、本質の動作だけが約1秒動いて、止まる。</span><br>Every candidate as a motion pictogram. As in EJP, only the essential action moves, for about a second, then it holds.</p>
    </div>
    <div class="ctrl" role="group" aria-label="Playback">
      <button type="button" id="b1" aria-pressed="true">1×</button>
      <button type="button" id="b3" aria-pressed="false">0.3× slow</button>
      <button type="button" id="bp" aria-pressed="false">Pause</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg', INK = 'var(--ink)', BG = 'var(--tile)', MIRU = 'var(--miru)';
  function el(tag, a, parent) { var e = document.createElementNS(NS, tag); for (var k in a) e.setAttribute(k, a[k]); if (parent) parent.appendChild(e); return e; }
  function set(e, a) { for (var k in a) e.setAttribute(k, a[k]); }
  var clamp = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
  var P = function (t, a, b) { return clamp((t - a) / (b - a)); };
  var L = function (a, b, u) { return a + (b - a) * u; };
  var E = {
    out: function (t) { return 1 - Math.pow(1 - t, 3); },
    inn: function (t) { return t * t; },
    io: function (t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
    back: function (t) { var c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
    // a fall that lands with one small bounce
    drop: function (t) { if (t < .7) return (t / .7) * (t / .7); var u = (t - .7) / .3; return 1 - Math.sin(u * Math.PI) * 0.08; }
  };
  function tf(x, y, r, s, cx, cy) { cx = cx || 0; cy = cy || 0; return 'translate(' + x + ' ' + y + ') rotate(' + (r || 0) + ' ' + cx + ' ' + cy + ') translate(' + cx + ' ' + cy + ') scale(' + (s === undefined ? 1 : s) + ') translate(' + (-cx) + ' ' + (-cy) + ')'; }
  function rng(seed) { return function () { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }; }

  var G = [];
  function group(key, jp, en) { var g = { key: key, jp: jp, en: en, tiles: [] }; G.push(g); return g; }

  // ---------- 浮世絵 ----------
  var g1 = group('ukiyoe', '浮世絵', 'Ukiyo-e');
  g1.tiles.push({ n: '①', jp: '版を1色ずつ摺り重ねる。色面が1枚ずつ、見当に合わせて落ちる', en: 'Blocks printed one colour at a time, each landing on the registration mark', cycle: 3.2, setup: function (s) {
    el('rect', { x: 20, y: 66, width: 3.5, height: 16, fill: INK }, s); el('rect', { x: 20, y: 78.5, width: 14, height: 3.5, fill: INK }, s);
    var layers = [
      el('rect', { x: 28, y: 64, width: 52, height: 14, fill: INK, stroke: BG, 'stroke-width': 2.4 }, s),
      el('path', { d: 'M30 64 L54 32 L78 64 Z', fill: INK, stroke: BG, 'stroke-width': 2.4, 'stroke-linejoin': 'round' }, s),
      el('circle', { cx: 72, cy: 28, r: 6.5, fill: INK, stroke: BG, 'stroke-width': 2.4 }, s)
    ];
    return function (t) { layers.forEach(function (l, i) { var u = P(t, .35 + i * .32, .53 + i * .32); set(l, { opacity: u > 0 ? 1 : 0, transform: tf(L(-3, 0, E.inn(u)), L(-12, 0, E.drop(u))) }); }); };
  } });
  g1.tiles.push({ n: '②', jp: '紙の角の見当（かぎ形）に、紙がぴたりと合う', en: 'The paper slides into the corner registration mark and fits exactly', cycle: 3.0, setup: function (s) {
    el('rect', { x: 22, y: 60, width: 3.5, height: 20, fill: INK }, s); el('rect', { x: 22, y: 76.5, width: 20, height: 3.5, fill: INK }, s);
    var paper = el('rect', { x: 27, y: 30, width: 46, height: 45, fill: 'none', stroke: INK, 'stroke-width': 3.2 }, s);
    return function (t) { var u = E.back(P(t, .45, .95)); set(paper, { transform: tf(L(16, 0, u), L(-15, 0, u), L(9, 0, u), 1, 27, 75) }); };
  } });
  g1.tiles.push({ n: '③', jp: 'バレンが円を描いて擦る', en: 'The baren rubs in circles, then lifts to show the print', cycle: 3.4, setup: function (s) {
    el('rect', { x: 24, y: 36, width: 52, height: 42, fill: 'none', stroke: INK, 'stroke-width': 3.2 }, s);
    var print = el('path', { d: 'M32 72 L50 46 L68 72 Z', fill: INK }, s);
    var baren = el('g', {}, s);
    el('circle', { cx: 0, cy: 0, r: 13, fill: INK }, baren); el('circle', { cx: 0, cy: 0, r: 7.5, fill: 'none', stroke: BG, 'stroke-width': 1.8 }, baren); el('circle', { cx: 0, cy: 0, r: 2.6, fill: BG }, baren);
    return function (t) {
      var u = P(t, .3, 1.7), a = u * Math.PI * 4, lift = E.inn(P(t, 1.8, 2.15));
      var x = 50 + 9 * Math.cos(a) + lift * 26, y = 58 + 6 * Math.sin(a) - lift * 34;
      set(baren, { transform: 'translate(' + x + ' ' + y + ')', opacity: lift >= 1 ? 0 : 1 });
      set(print, { opacity: t > 1.85 ? 1 : 0 });
    };
  } });

  // ---------- 文様 ----------
  var g2 = group('monyo', '文様', 'Traditional patterns');
  function asanoha(parent, cx, cy, r) {
    var g = el('g', {}, parent), V = [];
    for (var i = 0; i < 6; i++) { var a = Math.PI / 6 + i * Math.PI / 3; V.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]); }
    var d = 'M' + V.map(function (v) { return v[0].toFixed(2) + ' ' + v[1].toFixed(2); }).join('L') + 'Z';
    for (var j = 0; j < 6; j++) {
      var A = [cx, cy], B = V[j], C = V[(j + 1) % 6], c = [(A[0] + B[0] + C[0]) / 3, (A[1] + B[1] + C[1]) / 3];
      d += 'M' + cx + ' ' + cy + 'L' + B[0].toFixed(2) + ' ' + B[1].toFixed(2);
      [A, B, C].forEach(function (p) { d += 'M' + p[0].toFixed(2) + ' ' + p[1].toFixed(2) + 'L' + c[0].toFixed(2) + ' ' + c[1].toFixed(2); });
    }
    el('path', { d: d, fill: 'none', stroke: INK, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
    return g;
  }
  g2.tiles.push({ n: '①', jp: '1つの単位が繰り返されて、面になる', en: 'One unit repeats until it becomes a surface', cycle: 3.4, setup: function (s) {
    var r = 11, dx = r * Math.sqrt(3), dot = el('circle', { cx: 50, cy: 50, r: 3, fill: INK }, s);
    var units = [[0, 0]].concat([0, 1, 2, 3, 4, 5].map(function (i) { var a = i * Math.PI / 3; return [dx * Math.cos(a), dx * Math.sin(a)]; }));
    var gs = units.map(function (o) { return asanoha(s, 50 + o[0], 50 + o[1], r); });
    return function (t) {
      set(dot, { opacity: t < .55 ? 1 : 0 });
      gs.forEach(function (g, i) { var st = i === 0 ? .5 : .95 + (i - 1) * .11, u = P(t, st, st + (i === 0 ? .3 : .12)); set(g, { opacity: u > 0 ? 1 : 0, transform: tf(0, 0, 0, i === 0 ? E.back(u) : L(.85, 1, u), 50 + units[i][0], 50 + units[i][1]) }); });
    };
  } });
  g2.tiles.push({ n: '②', jp: '型紙を外すと、模様が残る', en: 'The stencil lifts and the pattern stays', cycle: 3.2, setup: function (s) {
    var holes = '', dots = el('g', {}, s);
    for (var i = 0; i < 3; i++) for (var j = 0; j < 3; j++) { var x = 36 + i * 14, y = 36 + j * 14; holes += 'M' + (x + 4.5) + ' ' + y + 'a4.5 4.5 0 1 0 -9 0a4.5 4.5 0 1 0 9 0Z'; el('circle', { cx: x, cy: y, r: 4.5, fill: INK }, dots); }
    var stencil = el('g', {}, s);
    el('path', { d: 'M22 22H78V78H22Z' + holes, fill: INK, 'fill-rule': 'evenodd' }, stencil);
    var filled = el('g', {}, stencil);
    for (var a = 0; a < 3; a++) for (var b = 0; b < 3; b++) el('circle', { cx: 36 + a * 14, cy: 36 + b * 14, r: 4.5, fill: INK }, filled);
    return function (t) {
      set(dots, { opacity: t > .9 ? 1 : 0 });
      set(filled, { opacity: t > .6 ? 1 : 0 });
      var u = E.inn(P(t, 1.0, 1.4));
      set(stencil, { transform: tf(L(0, 10, u), L(0, -90, u), L(0, -8, u), 1, 50, 50) });
    };
  } });

  // ---------- Figma プラグイン ----------
  var g3 = group('plugin', 'Figmaプラグイン開発', 'Figma plugins');
  function cursor(parent) { return el('path', { d: 'M0 0 L0 14 L3.6 10.6 L6.4 16.4 L8.8 15.2 L6 9.6 L11 9.6 Z', fill: INK, stroke: BG, 'stroke-width': 1.2, 'stroke-linejoin': 'round' }, parent); }
  g3.tiles.push({ n: '①', jp: '散らばった四角が、1回の操作で一斉にそろう', en: 'Scattered squares line up all at once with one action', cycle: 3.0, setup: function (s) {
    var R = rng(11), from = [], to = [], sq = [];
    for (var i = 0; i < 6; i++) { from.push([18 + R() * 56, 18 + R() * 56, (R() - .5) * 50]); to.push([29 + (i % 3) * 16, 36 + Math.floor(i / 3) * 16, 0]); sq.push(el('rect', { x: 0, y: 0, width: 12, height: 12, fill: INK }, s)); }
    var cur = cursor(s);
    return function (t) {
      var u = P(t, .75, 1.15);
      sq.forEach(function (q, i) { var v = E.back(clamp(u * 1.15 - i * .03)); var f = from[i], g = to[i]; set(q, { transform: tf(L(f[0], g[0], v), L(f[1], g[1], v), L(f[2], 0, v), 1, 6, 6) }); });
      var press = t > .55 && t < .7 ? .82 : 1;
      set(cur, { transform: 'translate(74 70) scale(' + press + ')' });
    };
  } });
  // ② revised 2026-11-26: the play-like ▶ read as media playback (the user: 「なぜ再生ボタンみたいなのがある」).
  // Now: two bars filled by hand, one at a time; reset; a plain button (no symbol) is clicked once and all three fill together.
  g3.tiles.push({ n: '②', jp: '1本ずつ手で埋めていた作業が、1回のクリックで全部埋まる', en: 'Work filled in one by one by hand is done all at once with a single click', cycle: 3.8, setup: function (s) {
    var bars = [0, 1, 2].map(function (i) { return el('rect', { x: 40, y: 34 + i * 12, width: 38, height: 7, fill: 'none', stroke: INK, 'stroke-width': 2.4 }, s); });
    var btn = el('rect', { x: 20, y: 43, width: 12, height: 12, rx: 3, fill: INK }, s);
    var cur = cursor(s);
    return function (t) {
      var reset = t > 1.25 && t < 1.95, all = t >= 2.05;
      bars.forEach(function (b, i) { var byHand = i < 2 && t > .45 + i * .4 && t < 1.25; set(b, { fill: byHand || all ? INK : 'none' }); });
      set(btn, { transform: tf(0, 0, 0, t > 1.95 && t < 2.1 ? .86 : 1, 26, 49) });
      var x, y;
      if (t < 1.25) { var k = t < .85 ? 0 : 1; x = 70; y = 36 + k * 12; }
      else { var m = E.io(P(t, 1.35, 1.8)); x = L(70, 28, m); y = L(48, 50, m); }
      set(cur, { transform: 'translate(' + x + ' ' + y + ') scale(' + ((t > .4 && t < .5) || (t > .8 && t < .9) || (t > 1.95 && t < 2.1) ? .82 : 1) + ')' });
    };
  } });

  // ---------- Podcast 視聴記録 ----------
  var g4 = group('notes', 'Podcast 視聴記録', 'Podcast notes');
  g4.tiles.push({ n: '①', jp: '聴いた1回が1画になり、正の字がたまる', en: 'Each listen adds one stroke, and the 正 tally fills up', cycle: 3.6, setup: function (s) {
    var W = 6, strokes = [
      { x: 26, y: 24, w: 48, h: W, dir: 'x' }, { x: 47, y: 24, w: W, h: 52, dir: 'y' }, { x: 47, y: 47, w: 22, h: W, dir: 'x' },
      { x: 31, y: 47, w: W, h: 29, dir: 'y' }, { x: 22, y: 73, w: 56, h: W, dir: 'x' }
    ].map(function (o) { o.e = el('rect', { x: o.x, y: o.y, width: o.w, height: o.h, fill: INK }, s); return o; });
    return function (t) { strokes.forEach(function (o, i) { var u = E.out(P(t, .3 + i * .36, .44 + i * .36)); set(o.e, o.dir === 'x' ? { width: o.w * u } : { height: o.h * u }); }); };
  } });
  g4.tiles.push({ n: '②', jp: '聞いた言葉が、要点の点に変わる', en: 'The words heard turn into key-point dots', cycle: 3.0, setup: function (s) {
    el('path', { d: 'M24 26 H76 V66 H44 L34 76 V66 H24 Z', fill: 'none', stroke: INK, 'stroke-width': 3, 'stroke-linejoin': 'round' }, s);
    var lens = [40, 34, 38], lines = lens.map(function (w, i) { return el('rect', { x: 30, y: 34 + i * 9, width: w, height: 3.6, fill: INK }, s); });
    var dots = lens.map(function (w, i) { return el('circle', { cx: 32, cy: 35.8 + i * 9, r: 2.6, fill: INK }, s); });
    var keep = [16, 12, 20];
    return function (t) { var u = E.io(P(t, .6, 1.0)); lines.forEach(function (l, i) { set(l, { x: L(30, 38, u), width: L(lens[i], keep[i], u) }); set(dots[i], { opacity: u > .5 ? 1 : 0, r: 2.6 * E.back(P(t, .85 + i * .06, 1.05 + i * .06)) }); }); };
  } });

  // refinements of ② (the user: 「まだこっちの方がマシ」, 2026-11-25)
  function bubble(s, y0) { y0 = y0 || 0; return el('path', { d: 'M24 ' + (22 + y0) + ' H76 V' + (58 + y0) + ' H44 L34 ' + (68 + y0) + ' V' + (58 + y0) + ' H24 Z', fill: 'none', stroke: INK, 'stroke-width': 3, 'stroke-linejoin': 'round' }, s); }
  g4.tiles.push({ n: '②-a', jp: '言葉が流れ込み、点だけを残して消える（聞く → 要点）', en: 'Words stream in, then vanish, leaving only the dots: listening becomes key points', cycle: 3.6, setup: function (s) {
    bubble(s);
    var lens = [40, 34, 38], lines = lens.map(function (w, i) { return el('rect', { x: 30, y: 30 + i * 9, width: 0, height: 3.6, fill: INK }, s); });
    var dots = lens.map(function (w, i) { return el('circle', { cx: 32, cy: 31.8 + i * 9, r: 0, fill: INK }, s); });
    return function (t) {
      lines.forEach(function (l, i) {
        var grow = E.out(P(t, .25 + i * .22, .55 + i * .22)), gone = E.io(P(t, 1.45 + i * .05, 1.8 + i * .05));
        set(l, { x: L(30, 30 + lens[i], gone), width: lens[i] * grow * (1 - gone) });
        set(dots[i], { r: 2.8 * E.back(P(t, 1.7 + i * .07, 1.95 + i * .07)) });
      });
    };
  } });
  g4.tiles.push({ n: '②-b', jp: '吹き出しから点だけが落ち、ノートに3つ並ぶ（持ち帰る）', en: 'Only the dots drop out of the bubble and line up in the notebook: taking it home', cycle: 3.6, setup: function (s) {
    bubble(s, -6);
    el('rect', { x: 26, y: 86, width: 48, height: 2.4, fill: INK }, s);
    var lens = [40, 34, 38], lines = lens.map(function (w, i) { return el('rect', { x: 30, y: 24 + i * 9, width: w, height: 3.6, fill: INK }, s); });
    var dots = lens.map(function (w, i) { return el('circle', { cx: 32, cy: 25.8 + i * 9, r: 2.8, fill: INK, opacity: 0 }, s); });
    return function (t) {
      lines.forEach(function (l, i) {
        var shrink = E.io(P(t, .45, .85)); set(l, { x: L(30, 37, shrink), width: lens[i] * (1 - shrink), opacity: shrink >= 1 ? 0 : 1 });
        // each dot slides to the tail, then drops out through it onto the notebook line
        var st = 1.0 + i * .3, f1 = E.io(P(t, st, st + .22)), f2 = E.inn(P(t, st + .22, st + .34)), f3 = P(t, st + .34, st + .64);
        var x, y;
        if (f3 > 0) { x = L(35.2, 38 + i * 12, E.io(f3)); y = L(60, 80, E.drop(f3)); }
        else if (f2 > 0) { x = L(37, 35.2, f2); y = L(44, 60, f2); }
        else { x = L(32, 37, f1); y = L(25.8 + i * 9, 44, f1); }
        set(dots[i], { opacity: shrink > .4 ? 1 : 0, cx: x, cy: y });
      });
    };
  } });
  g4.tiles.push({ n: '②-c', jp: '行はなく、吹き出しの中の点3つが1つに凝縮する', en: 'No lines: three dots in the bubble condense into one', cycle: 3.2, setup: function (s) {
    bubble(s);
    var X = [38, 50, 62], dots = X.map(function (x) { return el('circle', { cx: x, cy: 40, r: 3.2, fill: INK }, s); });
    return function (t) {
      var appear = function (i) { return E.back(P(t, .25 + i * .16, .45 + i * .16)); };
      var c = E.io(P(t, 1.1, 1.5)), grow = E.back(P(t, 1.45, 1.75));
      dots.forEach(function (d, i) { set(d, { cx: L(X[i], 50, c), r: c < 1 ? 3.2 * appear(i) : (i === 1 ? L(3.2, 6, grow) : 0) }); });
    };
  } });

  // ---------- Podcast 制作 ----------
  var g5 = group('making', 'Podcast 制作', 'Making a podcast');
  g5.tiles.push({ n: '①', jp: '録音の点が灯り、声の波形が立ち上がる', en: 'The record dot lights up and the voice waveform rises', cycle: 3.2, setup: function (s) {
    var dot = el('circle', { cx: 24, cy: 50, r: 5.5, fill: INK }, s), H = [8, 18, 30, 42, 26, 36, 16, 28, 10, 6], bars = H.map(function (h, i) { return el('rect', { x: 36 + i * 4.4, y: 50, width: 2.6, height: 0, fill: INK }, s); });
    return function (t) {
      var pulse = t > .3 && t < .5 ? 1.35 : 1; set(dot, { r: 5.5 * pulse });
      bars.forEach(function (b, i) { var u = E.back(P(t, .6 + i * .05, .85 + i * .05)), h = H[i] * u; set(b, { y: 50 - h / 2, height: Math.max(0, h) }); });
    };
  } });
  g5.tiles.push({ n: '②', jp: '点から輪が広がる（声が届く）', en: 'Rings spread from a dot: the voice reaches out', cycle: 3.0, setup: function (s) {
    var dot = el('circle', { cx: 50, cy: 66, r: 5.5, fill: INK }, s);

  } });
  g7.tiles.push({ n: '②', jp: '点が近い順につながって、網になる', en: 'Dots join their nearest neighbours into a network', cycle: 3.4, setup: function (s) {

  // ---------- 着地: ロゴ ----------

  // ---------- build + clock ----------
  var main = document.getElementById('main'), all = [];
  G.forEach(function (g) {

  });

  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var speed = 1, paused = reduce, clock = 0, last = null;
  function frame(now) {
    if (last !== null && !paused) clock += (now - last) / 1000 * speed;
    last = now;
    all.forEach(function (a) { a.update(reduce ? a.cycle - .01 : clock % a.cycle); });
    requestAnimationFrame(frame);
  }
  if (reduce) all.forEach(function (a) { a.update(a.cycle - .01); });
  // review hook: freeze every tile at time t
  window.__seekAll = function (t) { paused = true; clock = t; };

})();
